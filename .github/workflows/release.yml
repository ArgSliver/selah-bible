name: Build & Release APK (Obtainium Ready)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.1)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Python converter tests
        run: python3 -m unittest discover -s tools -v

      - name: Run Android unit tests
        run: ./gradlew testDebugUnitTest

      - name: Decode optional release keystore
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "SELAH_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          SELAH_KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          SELAH_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SELAH_KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Prepare Obtainium-friendly APK asset
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          TAG="${INPUT_TAG:-${GITHUB_REF_NAME}}"
          cp app/build/outputs/apk/release/app-release.apk "selah-bible-${TAG}.apk"
          echo "RELEASE_TAG=${TAG}" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Selah Bible ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: selah-bible-*.apk
